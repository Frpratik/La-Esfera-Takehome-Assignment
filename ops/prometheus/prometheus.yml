# Example scrape config. /metrics is unauthenticated, so scrape it over the internal network only.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: helpdesk
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
