name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        # CPU-only torch first: the default wheel pulls ~2 GB of CUDA libraries CI never uses.
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Validate policy documents
        run: python -m ingest.validate_policies
      - name: Unit tests
        run: pytest -q

  eval:
    name: Evaluation (MiniLM + mock LLM)
    needs: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements-dev.txt
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2
      - name: Build index
        run: python -m ingest.build_index
      - name: Main eval set (quality gate)
        run: >
          python -m eval.run_eval --output eval-main.json
          --min-correctness 1.0 --min-top1 1.0 --min-refusal 1.0
      - name: Regression set from the debugging drill (quality gate)
        # The keyword-matching mock scores 0.75 on correctness here (see docs/DEBUGGING.md);
        # the gate guards ranking (top-1) and stops correctness from falling further.
        run: >
          python -m eval.run_eval --questions eval/regression_questions.json
          --output eval-regression.json --min-top1 1.0 --min-correctness 0.75
      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval-*.json

  frontend:
    name: Frontend type check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  config:
    name: Docker Compose and alert rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose file resolves with only .env.example
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Prometheus alert rules are valid
        run: >
          docker run --rm -v "$PWD/ops/prometheus:/etc/prom" --entrypoint promtool
          prom/prometheus:v2.55.1 check rules /etc/prom/alerts.yml
