<svg xmlns="http://www.w3.org/2000/svg" width="680" height="280" viewBox="0 0 680 280" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title>Build time: from policies to index</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="279" rx="16" fill="#FFFFFF" stroke="#D3D1C7"/>
<text x="40" y="30" font-size="16" font-weight="600" fill="#2C2C2A">Build time: from policies to index</text>
<text x="640" y="30" text-anchor="end" font-size="12" fill="#5F5E5A">python -m ingest.build_index</text>
<g transform="translate(0,30)">

<rect x="40" y="40" width="135" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="107.5" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">Policies</text>
<text x="107.5" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">8 markdown files</text>
<rect x="195" y="40" width="135" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="262.5" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">Chunker</text>
<text x="262.5" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">120-word pieces</text>
<rect x="350" y="40" width="135" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="417.5" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">Embedder</text>
<text x="417.5" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">384 numbers each</text>
<rect x="505" y="40" width="135" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="572.5" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">Index files</text>
<text x="572.5" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">FAISS + metadata</text>
<rect x="430" y="150" width="210" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="535.0" y="168" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">Startup freshness check</text>
<text x="535.0" y="188" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Rebuild if docs changed</text>
<line x1="175" y1="68" x2="193" y2="68" stroke="#73726C" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="330" y1="68" x2="348" y2="68" stroke="#73726C" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="485" y1="68" x2="503" y2="68" stroke="#73726C" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="572" y1="96" x2="572" y2="148" stroke="#73726C" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 430 178 L 262 178 L 262 98" fill="none" stroke="#73726C" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
</g>
</svg>
