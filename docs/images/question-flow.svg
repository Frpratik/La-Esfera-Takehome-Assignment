<svg xmlns="http://www.w3.org/2000/svg" width="680" height="510" viewBox="0 0 680 510" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title>Question time: one /ask request</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="509" rx="16" fill="#FFFFFF" stroke="#D3D1C7"/>
<text x="40" y="30" font-size="16" font-weight="600" fill="#2C2C2A">Question time: one /ask request</text>
<text x="640" y="30" text-anchor="end" font-size="12" fill="#5F5E5A">every question</text>
<g transform="translate(0,30)">

<rect x="150" y="40" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="270.0" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">Question</text>
<text x="270.0" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">From chat page, with key</text>
<rect x="150" y="120" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="270.0" y="138" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">Auth + validation</text>
<text x="270.0" y="158" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">X-API-Key vs API_KEY</text>
<rect x="150" y="200" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="270.0" y="218" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">Hybrid retrieval</text>
<text x="270.0" y="238" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Meaning + keywords, top 4</text>
<rect x="150" y="280" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="270.0" y="298" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">Generate answer</text>
<text x="270.0" y="318" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Mock or Groq LLM</text>
<rect x="150" y="360" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="270.0" y="378" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">Return and log</text>
<text x="270.0" y="398" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Answer, sources, latency</text>
<line x1="270" y1="96" x2="270" y2="118" stroke="#73726C" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="270" y1="176" x2="270" y2="198" stroke="#73726C" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="270" y1="256" x2="270" y2="278" stroke="#73726C" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="270" y1="336" x2="270" y2="358" stroke="#73726C" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="430" y="120" width="210" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="535.0" y="138" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">401 or 422</text>
<text x="535.0" y="158" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Bad key or empty question</text>
<line x1="390" y1="148" x2="428" y2="148" stroke="#73726C" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="430" y="200" width="210" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="535.0" y="218" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">Index files</text>
<text x="535.0" y="238" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Vectors + chunk text</text>
<line x1="430" y1="228" x2="392" y2="228" stroke="#73726C" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="430" y="280" width="210" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="535.0" y="298" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">"I don't know"</text>
<text x="535.0" y="318" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">If nothing relevant</text>
<line x1="390" y1="308" x2="428" y2="308" stroke="#73726C" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="430" y="360" width="210" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="535.0" y="378" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">Postgres</text>
<text x="535.0" y="398" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Feeds /stats, /feedback</text>
<line x1="390" y1="388" x2="428" y2="388" stroke="#73726C" stroke-width="1.5" marker-end="url(#arrow)"/>
</g>
</svg>
