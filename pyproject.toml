[project]
name = "policy-helpdesk"
version = "0.1.0"
description = "Small RAG service answering questions over company policies"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Header() in argument defaults is the framework's standard pattern.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[tool.pytest.ini_options]
testpaths = ["tests"]
